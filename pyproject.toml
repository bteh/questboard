[project]
name = "questboard"
version = "0.2.0"
description = "AI-powered job search pipeline — scrape, score, optimize, and track job applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "python-jobspy>=1.1.75",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "ddgs>=9.0.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "pyinstaller>=6.15.0",
]

[project.optional-dependencies]
# Local semantic ranking (hybrid retrieval). Optional and ships dark: without
# it, job_finder.embedder degrades to a no-op and ranking uses keywords/BM25.
# fastembed is ONNX-based (no torch); the model downloads on first use.
embeddings = [
    "fastembed>=0.4",
]

[project.scripts]
questboard = "job_finder.main:run"
questboard-setup = "job_finder.setup:run_setup"
job-finder = "job_finder.main:run"
search-jobs = "job_finder.main:search"
score-jobs = "job_finder.main:score"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/bteh/questboard"
Repository = "https://github.com/bteh/questboard"
Issues = "https://github.com/bteh/questboard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/job_finder"]
