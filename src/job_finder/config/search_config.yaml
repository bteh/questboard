# Neutral fallback configuration for a fresh checkout or packaged runtime.
# Personal roles, locations, compensation, and resume paths belong in the
# workspace database or an ignored config/profiles/<name>.yaml file. Never put
# a maintainer's search here: this file is shipped to every user.

target_roles: []
keyword_searches: []
locations: []

# Job boards to scrape via JobSpy.
#
# Only Google by default. Indeed/Glassdoor/ZipRecruiter were dropped because
# they fail consistently from a residential IP:
#   - Glassdoor returns 400 "location not parsed" for remote searches.
#   - ZipRecruiter returns 403 "forbidden aa" (Cloudflare) on every request.
# Each failure retries inside JobSpy and stalls the pipeline for ~60s per
# query. Indeed + LinkedIn both return live results from a local IP and are
# the workspace default too (see _DEFAULT_JOBSPY_BOARDS in
# backend/app/services/workspace_service.py); keep this YAML aligned. Google
# is off — it CAPTCHA-walls residential IPs and returned nothing, which
# silently zeroed every search. The per-board circuit breaker skips any board
# that starts failing, so listing two working boards is safe.
#
# Re-enable Glassdoor / ZipRecruiter manually if you have a proxy workaround.
job_boards:
  - "indeed"
  - "linkedin"
  # - "google"
  # - "glassdoor"
  # - "zip_recruiter"

# Additional sources (custom scrapers)
additional_sources:
  - name: "workatastartup"
    url: "https://www.workatastartup.com/jobs"
    enabled: true
  - name: "remotive"
    enabled: true
  - name: "himalayas"
    enabled: true
  - name: "weworkremotely"
    enabled: true
  - name: "hackernews"
    enabled: true
  - name: "greenhouse"
    url_pattern: "boards.greenhouse.io"
    enabled: true
  - name: "lever"
    url_pattern: "jobs.lever.co"
    enabled: true
  - name: "remoteok"
    enabled: true
  - name: "cryptojobslist"
    enabled: true
  - name: "web3career"
    enabled: true
  - name: "getro"
    enabled: true
  - name: "consider"
    enabled: true
  - name: "workday"
    enabled: true
  - name: "arbeitnow"
    enabled: true
  - name: "themuse"
    enabled: true

# Career baseline. Blank values keep the level filter disabled until the user
# describes their own work.
career_baseline:
  current_title: ""
  current_level: ""
  current_tc: 0
  preferred_direction: "any"

# Scoring weights (must sum to 1.0)
scoring:
  technical_skills: 0.25
  leadership_signal: 0.15
  comp_potential: 0.12
  platform_building: 0.13
  company_trajectory: 0.10
  culture_fit: 0.10
  career_progression: 0.15

# Compensation filters
compensation:
  currency: "USD"
  pay_period: "annual"
  target_total_comp: 0
  include_equity: true

# Search frequency
search_settings:
  results_per_board: 50
  results_per_additional_source: 500
  max_days_old: 30
  exclude_staffing_agencies: true
  country: "USA"
  max_parallel_searches: 6  # Concurrent JobSpy workers (each hits 5 boards, so 6 = 30 requests)
  max_unique_jobs: 500      # Per-JobSpy-board cap, kept per place; one source never cancels another
  min_queries_per_source: 15 # Role queries a board must run in a place before that place's cap can stop the rest
  max_search_tasks: 30      # Hard cap on total JobSpy queries (term × location combos)
  ai_score_top_n: 60        # Keyword-score all jobs, then AI-score only the top N for speed (<=0 = AI-score all)

# Applicant information (used for auto-apply)
applicant_info:
  first_name: ""
  last_name: ""
  email: ""
  phone: ""
  linkedin_url: ""

# Auto-apply configuration (opt-in)
# Application kits: everything prefilled, YOU send it. Questboard never
# transmits an application (docs/anti-slop.md).
auto_apply:
  enabled: false  # Set to true to prepare kits for STRONG_APPLY jobs
