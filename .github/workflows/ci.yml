name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas changed so PRs only run the relevant jobs.
  # Pushes to main/tags always run everything (full validation post-merge).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'backend/**'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'setup.py'
              - 'setup.cfg'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  lint-python:
    name: Validate Python
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff fatal checks
        run: python -m ruff check src/ backend/ --select F63,F7,F82,E9
      - name: Compile Python sources
        run: python -m compileall -q src backend

  test-python:
    name: Test Python (${{ matrix.python-version }})
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # PRs test only the primary version for fast feedback; main/tags
      # validate the full supported matrix.
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./backend
          pip install pytest
      - name: Run tests
        run: pytest tests/ -q --tb=short

  frontend:
    name: Frontend
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  desktop-smoke:
    name: Desktop Smoke
    # Release-grade integration test — slow, brittle for per-PR feedback.
    # Only runs post-merge to main + workflow_dispatch. Re-enable on
    # pull_request once the test stabilizes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -e .
          ./.venv/bin/pip install -e ./backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run desktop smoke test
        run: make desktop-smoke

  desktop-scaffold:
    name: Desktop Scaffold
    # See note on desktop-smoke. Same gating rationale.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -e .
          ./.venv/bin/pip install -e ./backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate desktop runtime sidecar build
        run: ./.venv/bin/python scripts/build_desktop_sidecar.py
      - name: Check desktop Rust crate
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml
      - name: Validate Tauri config
        working-directory: frontend
        run: npm exec tauri info
      - name: Check Rust formatting
        run: cargo fmt --manifest-path frontend/src-tauri/Cargo.toml --all --check

  desktop-macos:
    name: Desktop macOS Bundle
    # macOS runners bill at 10x — building a bundle on every main push can
    # burn the whole monthly Actions quota. The bundle is only useful for
    # releases (and needs an Apple Developer account for signing anyway), so
    # build it on version tags or manual dispatch only, not every push.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -e .
          ./.venv/bin/pip install -e ./backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build desktop bundle
        run: make desktop-build
      - name: Verify desktop bundle
        run: ./.venv/bin/python scripts/verify_desktop_bundle.py
