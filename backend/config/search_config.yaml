# Neutral fallback only. User intent belongs in workspace preferences or an
# ignored per-user profile, never in a tracked file shipped to other people.
target_roles: []
keyword_searches: []
locations: []

# Job boards to scrape via JobSpy
job_boards:
  - "indeed"
  - "linkedin"

# Additional sources (custom scrapers)
additional_sources:
  - name: "workatastartup"
    enabled: true
  - name: "remotive"
    enabled: true
  - name: "himalayas"
    enabled: true
  - name: "weworkremotely"
    enabled: true
  - name: "hackernews"
    enabled: true
  - name: "greenhouse"
    enabled: true
  - name: "lever"
    enabled: true
  - name: "remoteok"
    enabled: true
  - name: "cryptojobslist"
    enabled: true
  - name: "web3career"
    enabled: true
  - name: "workday"
    enabled: true
  - name: "arbeitnow"
    enabled: true
  - name: "themuse"
    enabled: true

# Scoring weights
scoring:
  technical_skills: 0.30
  leadership_signal: 0.20
  comp_potential: 0.15
  platform_building: 0.15  # "building from scratch" signal
  company_trajectory: 0.10
  culture_fit: 0.10

# Compensation filters stay unset until the user supplies them.
compensation:
  currency: "USD"
  pay_period: "annual"
  target_total_comp: 0
  include_equity: true

# Search frequency
search_settings:
  results_per_board: 50
  results_per_additional_source: 100
  max_days_old: 45
  exclude_staffing_agencies: true
  country: "USA"
  max_parallel_searches: 6
  max_unique_jobs: 500      # Per board; a prolific source cannot cancel the others
  min_queries_per_source: 15
  max_search_tasks: 30
